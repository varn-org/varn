name: Apps

on:
  workflow_dispatch:
    inputs:
      varn-version:
        description: "release whose native artifacts the apps link against"
        default: "latest"
  workflow_call:
    inputs:
      varn-version:
        type: string
        default: "latest"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "apps/samples/**"
      - "tools/core/apps.py"
      - ".github/workflows/build-apps.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "apps/samples/**"
      - "tools/core/apps.py"
      - ".github/workflows/build-apps.yml"

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  VARN_VERSION: ${{ inputs.varn-version || 'latest' }}

jobs:
  android:
    name: Android app
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the app links the released aar rather than building the engine from source
      - name: Fetch the engine
        run: python3 varn.py fetch-native --platform android --version ${{ env.VARN_VERSION }}

      - name: Build
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      # the apk is only useful when it carries the engine and the shared samples, so both are checked
      - name: Verify the apk
        working-directory: apps/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libvarn.so"
          unzip -l "$APK" | grep -q "assets/manifest.json"
          test "$(unzip -l "$APK" | grep -c 'assets/lua/')" -eq "$(ls ../samples/lua | wc -l)"

      # r8 renames anything it is not told to keep, so the minified apk is what proves the engine's keep rules work
      - name: Verify the minified apk keeps the classes JNI resolves by name
        working-directory: apps/android
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          rm -rf dex && unzip -o -q "$APK" 'classes*.dex' -d dex
          for CLASS in VarnRuntime VarnHttp NativeChunkSink; do
            grep -qa "Lcom/varn/$CLASS;" dex/*.dex || { echo "r8 stripped or renamed com.varn.$CLASS"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: varn-android-app
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS app
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch the engine
        run: python3 varn.py fetch-native --platform ios --version ${{ env.VARN_VERSION }}

      - name: Generate the project
        working-directory: apps/ios
        run: xcodegen generate

      # a simulator build needs no signing identity, which is what keeps this runnable in ci
      - name: Build
        working-directory: apps/ios
        run: |
          # xcpretty exits zero on a failed build, so without pipefail the step reports success on a broken app
          set -o pipefail
          # A generic simulator destination builds arm64 and x86_64 into one products directory, where the two race over the same generated module and one of them loses.
          xcodebuild build \
            -project Varn.xcodeproj \
            -scheme Varn \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=$(uname -m) \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Verify the app bundle
        working-directory: apps/ios
        run: |
          APP=$(find build/Build/Products -name "Varn.app" -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "no Varn.app under build/Build/Products"
            find build/Build/Products -maxdepth 3 -name "*.app" -o -maxdepth 3 -type d | head -20
            exit 1
          fi

          echo "bundle: $APP"
          ls -1 "$APP"

          if [ ! -d "$APP/Frameworks/varn.framework" ]; then
            echo "the engine framework is missing from the bundle"
            ls -1 "$APP/Frameworks" 2>/dev/null || echo "no Frameworks directory at all"
            exit 1
          fi

          if [ ! -f "$APP/samples/manifest.json" ]; then
            echo "the sample manifest is missing from the bundle"
            ls -1 "$APP/samples" 2>/dev/null || echo "no samples directory at all"
            exit 1
          fi

          BUNDLED=$(ls "$APP/samples/lua" | wc -l | tr -d ' ')
          EXPECTED=$(ls ../samples/lua | wc -l | tr -d ' ')
          if [ "$BUNDLED" != "$EXPECTED" ]; then
            echo "the bundle carries $BUNDLED samples but the tree has $EXPECTED"
            exit 1
          fi

          echo "the bundle carries the engine and all $BUNDLED samples"
